name: Pages

# Publishes the project website (website/) with the Dokka API reference mounted at /api/.
# Enable once for the repository with GitHub Actions as the Pages source:
#   gh api -X POST repos/SpartanLaboratories/WebTools/pages -f build_type=workflow
# (or Settings -> Pages -> Build and deployment -> Source -> GitHub Actions).

on:
  push:
    branches: [master]
  workflow_dispatch:

# actions/deploy-pages needs `pages: write` and `id-token: write`. They are set at workflow level, so the `build` job
# inherits them too.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight - a cancelled deploy leaves the
# live site on the previous commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The JDK that runs Gradle (see ci.yml).
          java-version: "23"
      # setup-gradle stays on v5 (see ci.yml).
      - uses: gradle/actions/setup-gradle@v5

      # The root project aggregates the five published modules into one publication (see build.gradle.kts).
      - name: Generate API docs (Dokka)
        run: ./gradlew dokkaGeneratePublicationHtml --stacktrace

      - name: Assemble _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R website/. _site/
          rm -f _site/README.md   # notes for maintainers, not part of the published site

          # Brand assets (the Spartan Laboratories logo) live once in docs/brand and are shared with
          # the Dokka theme; the page references them under assets/brand/.
          mkdir -p _site/assets/brand
          cp -R docs/brand/. _site/assets/brand/

          # Dokka's V2 plugin writes the aggregated publication to build/dokka/html. There is no
          # fallback search: a changed output directory must fail here rather than ship a site
          # with no API reference.
          docs="build/dokka/html"
          if [ ! -f "$docs/index.html" ]; then
            echo "::error::No Dokka output found - expected build/dokka/html/index.html"
            exit 1
          fi
          echo "Publishing API docs from $docs"
          cp -R "$docs" _site/api

          # The organization's standard requires this file. It stops Jekyll dropping names that start
          # with an underscore; this deployment runs no Jekyll and Dokka's current output holds no such
          # name, so it is a safeguard.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true   # since v4 the artifact drops dotfiles; .nojekyll must ship

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
